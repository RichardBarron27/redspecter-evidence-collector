[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "redspecter-evidence-collector"
version = "0.1.0"
description = "Red Specter Evidence Collector"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["evid*"]

[project.scripts]
evid = "evid.cli:main"
